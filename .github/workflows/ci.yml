name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit, not by tag: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.22"
          python-version: "3.11"
      - name: install
        run: scripts/ci.sh install
      - name: lint
        run: scripts/ci.sh lint
      - name: types
        run: scripts/ci.sh types
      - name: test
        run: scripts/ci.sh test
      - name: canaries
        run: scripts/ci.sh canaries
      - name: audit
        run: scripts/ci.sh audit
