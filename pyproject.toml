[project]
name = "applied-ai-challenge"
version = "0.1.0"
description = "First-pass open-source approval agent for CRA SBOMs, and KeysBench, on a small purpose-built agent harness"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12,<2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pip-audit>=2.7",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A table of literal anchors that must match the source exactly; wrapping them hurts more than it helps.
"scripts/canaries.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["core", "harness", "app", "agent", "review", "state", "scripts", "samples"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# The pure core is what Legal relies on: hold it to the strictest settings.
[[tool.mypy.overrides]]
module = "core.*"
strict = true
