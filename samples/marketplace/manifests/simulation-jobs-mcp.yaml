apiVersion: marketplace/v1
id: simulation-jobs-mcp
version: "1.2.0"
kind: mcp-server
domains: [simulation]
owner: { team: sim-platform, contact: sim-platform@example.com }
summary: MCP server that submits simulation jobs to the cluster and summarises the results. Submitting spends cluster time, so it waits for a human.
data: { sensitivity: internal }
model: { provider: internal, id: llm-internal-small }
permissions:
  - { resource: "sim:queue/batch", access: write }
  - { resource: "sim:results/team-rf", access: read }
egress: [sim.example.com, llm.internal.example.com]
secrets:
  - { name: SIM_TOKEN, ref: "vault://sim-platform/job-submitter" }
tools:
  - name: submit_job
    effect: outward
    requires_human_approval: true
    definition_sha256: 0aa9f849f4906694885e4d8d46deb0c36111841a8feb8e83175f289dd9f1c61b
