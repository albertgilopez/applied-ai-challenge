# License policy: SPDX ids (case-insensitive). Anything not listed is "Needs review".
# Quote an id if YAML could read it as something else (yes, no, on, off, null, numbers).
allowed:
  - MIT
  - Apache-2.0
  - BSD-3-Clause
  - GPL-2.0-only WITH Classpath-exception-2.0
review:
  - LGPL-2.1-only
  - MPL-2.0
rejected:
  - GPL-3.0-only
  - AGPL-3.0-only
