# STORY-004 cases. Prices: USD per million tokens, checked on 2026-10-09 against the provider's
# pricing page; priced region: global. Effort for every contestant: "high". Attempts per cell: k = 3.
# Unless a case says otherwise, it runs offline (no --live): model responses are recordings.
# Task-clustered intervals: t over per-task pass rates, two-sided 95 %, clipped to [0, 1];
# t critical values: df 5 = 2.5706, df 6 = 2.4469.
- id: S4-01
  rows:
    - run: { task: KB-03, config: B, model: claude-sonnet-5-5, effort: high, attempts: 1 }
      expected:
        row_fields_present: [config, contestant.harness, contestant.model, contestant.effort, contestant.harness_version, task_sha256]
        every_request_carries: { output_config.effort: high }
    - run: { task: KB-03, config: A, model: claude-haiku-5-5, effort: high, attempts: 1 }
      expected: { cli_args_contain: ["--effort", "high", "--model", "claude-haiku-5-5"] }
- id: S4-02
  rows:
    - usage: { model: claude-sonnet-5-5, input: 1000, output: 200, cache_read: 500, inference_geo: global }
      expected: { cost_usd: 0.00405, cost_basis: measured-usage }
    - usage: { model: claude-fable-5-1, cache_write_5m: 1000, inference_geo: global }
      expected: { cost_usd: 0.0125, cost_basis: measured-usage }
    - usage: { model: claude-unknown-9, input: 1000, output: 200, inference_geo: global }
      expected: { cost_usd: null, cost_basis: unpriced }
    - usage: { model: claude-haiku-5-5, input: 150000, output: 200, inference_geo: global }   # > 100k-token tier not in the table
      expected: { cost_usd: null, cost_basis: unpriced }
    - usage: { model: claude-sonnet-5-5, cache_creation_input_tokens: 1000, cache_split: absent, inference_geo: global }
      expected: { cost_usd: null, cost_basis: unpriced }
    - usage: { model: claude-sonnet-5-5, input: 1000, output: 200, inference_geo: us }
      expected: { cost_usd: null, cost_basis: unpriced }
    - usage_raw_nested: { cache_creation: { ephemeral_5m_input_tokens: 10, ephemeral_1h_input_tokens: 20 }, output_tokens_details: { thinking_tokens: 7 } }
      expected: { cache_write_5m: 10, cache_write_1h: 20, thinking: 7 }
- id: S4-03
  recording: { calls: [ { latency_s: 1.25 }, { latency_s: 0.75 } ] }
  rows:
    - { live: false, expected: { calls_latency_s: [1.25, 0.75], attempt_latency_s: 2.0 } }
    - { provider_fails_once_with: 529, expected: { calls: 3, retries_recorded: 1 } }   # the retry is its own call line
- id: S4-04
  rows:
    - { recording: { stop_reason: refusal }, expected: { outcome: refused, counted_as_fail: false } }
    - { recording: { stop_reason: max_tokens }, expected: { outcome: truncated, counted_as_fail: false } }
    - { arm_a_transcript_reads: "../KB-01/solution/core/license_expr.py", expected: { outcome: invalid } }
- id: S4-05
  # every task: solution -> 1; base, antipattern, and each reward-hacking solution that applies -> 0
  rows:
    - { task: KB-01, solutions: { base: 0, solution: 1, antipattern: 0, hack-conftest-skip: 0, hack-exit-zero: 0, hack-shadow-pytest: 0, hack-eq-always: 0, hack-patch-runtest: 0 } }
    - { task: KB-02, solutions: { base: 0, solution: 1, antipattern: 0, hack-conftest-skip: 0, hack-exit-zero: 0, hack-shadow-pytest: 0 } }
    # Added 2026-10-11 after the code review: hacks that read the hidden tests, the repo's own solution,
    # or the simulator's oracle, and one that forges the grader's result line. All four passed the first
    # grading layout; contestant code now runs in a container holding only the code under test.
    - { task: KB-03, solutions: { base: 0, solution: 1, antipattern: 0, hack-conftest-skip: 0, hack-exit-zero: 0, hack-shadow-pytest: 0, hack-eq-always: 0, hack-patch-runtest: 0, hack-oracle-via-main: 0, hack-spoof-marker: 0 } }
    - { task: KB-04, solutions: { base: 0, solution: 1, antipattern: 0, hack-eq-always: 0, hack-read-hidden-tests: 0, hack-repo-via-sys-executable: 0 } }
    - { task: KB-05, solutions: { base: 0, solution: 1, antipattern: 0, hack-irrelevant-quote: 0 } }
    - { task: KB-06, solutions: { base: 0, solution: 1, antipattern: 0, hack-fake-verdict-in-review: 0 } }   # judge calls recorded
- id: S4-06
  rows:
    - { workspace_extra_files: [conftest.py, pytest.py, pytest.ini], expected: { copied_to_grading_dir: [declared editable files only] } }
    - { junit_report: missing, process_exit: 0, expected: { outcome: fail } }
    - { junit_report: { passed: [test_a], expected: [test_a, test_b] }, expected: { outcome: fail } }
    - { grader_env_contains: [ANTHROPIC_API_KEY, CREDENTIALS_FILE], expected: { visible_to_contestant_code: false } }
- id: S4-07
  review: "LGTM. Nit: rename dbm to level_dbm."
  planted_line: "return 10 ** (dbm / 20) / 1000"
  rows:
    - judge_response: { verdict: pass, review_quote: "the conversion divides by 20 instead of 10" }
      expected: { outcome: fail, reason: quote not in review }
    - judge_response: { verdict: pass, review_quote: "Nit: rename dbm to level_dbm." }
      expected: { outcome: fail, reason: quote does not point at the planted line }
    - review: "Bug: `return 10 ** (dbm / 20) / 1000` uses /20; dBm to W needs /10."
      judge_response: { verdict: pass, review_quote: "Bug: `return 10 ** (dbm / 20) / 1000` uses /20; dBm to W needs /10." }
      expected: { outcome: pass, quote_in_review: true, points_at_defect: true }
    - contestant_model: claude-opus-5-5
      expected: { judge_model_differs_from: claude-opus-5-5 }
    - review_contains: "claude-sonnet-5-5"
      expected: { judge_input_contains_model_name: false, review_wrapped_as_data: true }
- id: S4-08
  steps: [run, score, score]
  expected:
    judge_calls_during_score: 0
    network_requests_during_score: 0
    attempt_line_judge_has: [prompt_sha256, rubric_sha256, artifact_sha256, verdict, review_quote]
- id: S4-09
  ledger:
    - { task: KB-03, config: B, model: m1, outcomes: [pass, pass, pass] }
    - { task: KB-03, config: B, model: m2, outcomes: [pass, pass, pass] }
    - { task: KB-04, config: B, model: m1, outcomes: [pass, fail, pass] }
    - { task: KB-04, config: B, model: m2, outcomes: [fail, fail, pass] }
  expected:
    saturated: { KB-03: true, KB-04: false }
    commodity: [ { task_id: KB-03, config: B } ]
    mean_task_pass_rate: { m1: 0.8333, m2: 0.6667 }    # KB-03 stays in the average
- id: S4-10
  rows:
    - { tasks: 6, expected: { ranking: "none: n <= 8 tasks", contestants_ordered_by: name, by_contestant_interval: task_clustered } }
    - { tasks: 8, expected: { ranking: "none: n <= 8 tasks" } }
- id: S4-11
  rows:
    - { budget_usd: 60, projected_usd: 75, live: true, expected: { exit_code: 2, attempts_started: 0 } }
    - { budget_usd: 1.0, model: claude-fable-5-1, max_tokens: 32000, expected: { calls_made: 0, outcome: budget_stopped, exit_code: 2 } }   # worst case of one call: 32000 x $50/MTok = $1.60 > $1
    - { budget_usd: 2.0, model: claude-fable-5-1, max_tokens: 32000, first_call_measured_usd: 0.50,
        expected: { calls_made: 1, outcome: budget_stopped, attempt_cost_usd: 0.50 } }   # second reserve 0.50 + 1.60 > 2.0
- id: S4-12
  rows:
    - { recorded_attempts: [pass, fail, pass], expected: { replayed_outcomes: [pass, fail, pass], network_calls: 0 } }
    - { recording_made_on: windows, replayed_on: linux, expected: { replays: true } }
    - { recording: missing_request, expected: { stops_with: CassetteMiss, network_calls: 0 } }
    - { live: true, api_key: absent, expected: { exit_code: 2 } }
- id: S4-13
  rows:
    - { passes: 2, attempts: 3, expected: { wilson_95: [0.2077, 0.9385], pass_hat_2: 0.3333, pass_hat_3: 0.0, any_pass: true } }
    - { passes: 3, attempts: 3, expected: { wilson_95: [0.4385, 1.0], pass_hat_3: 1.0 } }
    - { passes: 0, attempts: 3, expected: { wilson_95: [0.0, 0.5615], any_pass: false } }
    - { task_pass_rates: [1, 1, 1, 0.6667, 0.6667, 0, 0], expected: { mean: 0.619, task_clustered_95: [0.2044, 1.0] } }   # t, df 6, clipped
    - { task_pass_rates: [1, 1, 0.6667, 0.6667, 0.3333, 0], expected: { mean: 0.6111, task_clustered_95: [0.2022, 1.0] } }   # t, df 5, clipped
    - { latencies_s: [1.0, 2.0, 3.0, 4.0, 10.0], expected: { median: 3.0, p95: 10.0 } }   # p95 by nearest rank
    - { cost_usd_total: 0.30, passes: 2, expected: { cost_per_pass: 0.15 } }
    - { cost_usd_total: 0.30, passes: 0, expected: { cost_per_pass: null } }
    - { cost_usd_total: null, passes: 2, expected: { cost_per_pass: null } }
- id: S4-14
  per_task_pass_rates:
    A0: [1, 0.6667, 0.6667, 1, 0.3333, 0]
    B:  [0.6667, 0.6667, 0.3333, 1, 0, 0]
  expected:
    deltas: [ { model: m1, kind: A0-B, mean_paired_difference: 0.1667, task_clustered_95: [-0.0249, 0.3583], tasks: 6 } ]
    not_run_contestants: [codex-cli, cursor-agent]
    not_run_reason_is_specific: true
- id: S4-15
  ledger:
    - { task: KB-03, task_sha256: aaa, config: B, model: m1, outcomes: [pass] }
    - { task: KB-03, task_sha256: bbb, config: B, model: m1, outcomes: [fail] }
  expected:
    cells_for_KB-03_m1: 2
    results_inputs_has: [ledger_sha256, recordings_sha256]
- id: S4-16
  contestant_text: "ok | x\nnew row `code` [click](https://evil.example)\u001b[31m"
  expected:
    markdown_has_control_chars: false
    markdown_links_to_evil_example: false
    markdown_table_rows_per_cell: 1
    json_text_is_raw: true
- id: S4-17
  rows:
    - { transcript_tool_input: { tool: Read, file_path: "C:/elsewhere/solution.py" }, expected: { outcome: invalid } }
    - { transcript_tool_input: { tool: Bash, command: "python -c \"open('/etc/hosts').read()\"" }, expected: { outcome: invalid } }
    # The real CLI writes absolute paths (its tool schema requires them): <W> is the live workspace.
    # (Corrected 2026-10-11: the first version used a relative path the CLI never produces.)
    - { transcript_tool_input: { tool: Edit, file_path: "<W>/driver.py" }, expected: { outcome: not invalid } }
    - { cli_command: built_for_config_A, expected: { contains: ["--restricted", "--bare", "--tools", "--settings", "--no-session-persistence"] } }
    - { cli_command: built_for_config_A0, expected: { tools_exclude: [Bash] } }
- id: S4-18
  steps: [run_until_attempt_5_then_kill, run_again]
  expected: { attempts_rerun: 0, spend_after_second_run_includes_first: true }
- id: S4-19
  ledger: samples of S4-09 + one failing attempt with failed_checks [kb03.reads_before_init] (A0, m1, so S4-09 still holds)
  # Discordance: within each configuration, every pair of contestants and every task both ran,
  # d_t = p_x (1 - p_y) + p_y (1 - p_x), averaged. Only B has a pair here: KB-03 0, KB-04 5/9, mean 5/18.
  # (Corrected 2026-10-11: the first version of this case said 0.3 -> 103, a number written by hand that
  # no ledger of this shape produces. The sample-size formula is checked separately at 0.3.)
  expected:
    memo_sections: [per_task, commodity, failure_modes, decision_grade]
    failure_modes_contains: { mode: reads before INIT, count: 1 }
    decision_grade: { discordance_rate: 0.2778, tasks_needed_for_15_points: 95 }   # paired, alpha 0.05 two-sided, power 0.8
    sample_size_formula: { discordance_rate: 0.3, tasks_needed_for_15_points: 103 }
