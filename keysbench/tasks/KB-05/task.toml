id = "KB-05"
track = "domain"
family = "pytest"
title = "Decline a request the manual says the meter cannot meet, quoting the limit"
editable = ["answer.json"]
expected_tests = [
    "test_kb05.py::test_declines_the_request",
    "test_kb05.py::test_quotes_a_limit_that_makes_it_infeasible",
    "test_kb05.py::test_the_quote_is_from_the_manual",
    "test_kb05.py::test_answers_the_team",
]
timeout_s = 60
