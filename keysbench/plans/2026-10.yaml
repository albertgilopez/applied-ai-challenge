# KeysBench, October 2026. Prices: harness/usage.py (checked 2026-10-09, region global).
label: keysbench-2026.10
cap_usd: 60.0
k: 3
effort: high
# The models compared. Anthropic's as /v1/models names them; other providers' as OpenRouter names them
# (provider/model), called through OpenRouter. Rounds run cheapest first.
models:
  - claude-haiku-5-5
  - claude-sonnet-5-5
  - claude-opus-5-5
  - claude-fable-5-1
  - openai/gpt-5.6-sol
  - google/gemini-3.1-pro-preview
  - qwen/qwen3-coder-next   # open-weights; OpenRouter lists no `reasoning` parameter for it, so effort is not applied
configs: [B, A0, A]
# A and A0 are the Claude Code CLI; other providers' models run in B, the common harness.
configs_by_model:
  openai/gpt-5.6-sol: [B]
  google/gemini-3.1-pro-preview: [B]
  qwen/qwen3-coder-next: [B]
tasks: [KB-01, KB-02, KB-03, KB-04, KB-05, KB-06]
max_tokens: 32000
max_steps: 12
# The judge is never the contestant's model (DR-8).
judge: { default: claude-opus-5-5, instead: claude-sonnet-5-5 }
# Claude Code CLI for configurations A and A0, pinned and installed in its own prefix (T0: 2.1.285 did not
# know the 5.5 models and priced them about forty times too high).
cli: { version: "2.1.296", timeout_s: 1800 }
# The reduction order, decided before the run. Steps are cumulative; `applied_step` says how many apply,
# and the report states which and why. `python -m keysbench project` prints the cost at each step from
# what the pilot measured. A step with `decided: false` can be projected but not applied.
reduction:
  - why: "Fable 5.1 costs five times Sonnet 5.5 per output token; one attempt each"
    decided: true
    limits: [{ model: claude-fable-5-1, k: 1 }]
  - why: "the CLI configurations, one attempt each; B, the common harness, keeps three"
    decided: true
    limits: [{ config: A0, k: 1 }, { config: A, k: 1 }]
  - why: "one attempt for everything"
    decided: true
    limits: [{ k: 1 }]
  - why: "recommended if step 3 still does not fit: Fable 5.1 out of A0 and A. It stays in B, so the four-model comparison holds on the common harness, and the A0-B and A-A0 deltas hold for three models"
    decided: false
    limits: [{ model: claude-fable-5-1, config: A0, k: 0 }, { model: claude-fable-5-1, config: A, k: 0 }]
applied_step: 0
not_run:
  - contestant: codex-cli
    reason: "not run: OpenAI's model is measured in configuration B (GPT-5.6 Sol); its own harness, the Codex CLI, needs an OpenAI account set up for this run, which was not"
  - contestant: cursor-agent
    reason: "not run: its headless agent reports no per-call token usage, so cost per pass could not be measured on the same basis"
