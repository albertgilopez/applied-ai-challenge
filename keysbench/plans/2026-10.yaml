# KeysBench, October 2026. Prices: harness/usage.py (checked 2026-10-09, region global).
label: keysbench-2026.10
cap_usd: 60.0
k: 3
effort: high
# The four models compared, as /v1/models names them. Rounds run cheapest first.
models: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-1]
configs: [B, A0, A]
tasks: [KB-01, KB-02, KB-03, KB-04, KB-05, KB-06]
max_tokens: 32000
max_steps: 12
# The judge is never the contestant's model (DR-8).
judge: { default: claude-opus-5-5, instead: claude-sonnet-5-5 }
# Claude Code CLI for configurations A and A0, pinned and installed in its own prefix (T0: 2.1.285 did not
# know the 5.5 models and priced them about forty times too high).
cli: { version: "2.1.296", timeout_s: 1800 }
# Reduction order, decided before the run, if the projection from the pilot is above the cap:
#   1. Fable 5.1 at k = 1 in every configuration;  2. A and A0 at k = 1;  3. everything at k = 1.
# Applied by setting k_by_model here and recording why in the report.
k_by_model: {}
not_run:
  - contestant: codex-cli
    reason: "same tasks and graders apply, but pricing needs per-call usage from an OpenAI account we did not set up for this run; protocol written, not run"
  - contestant: cursor-agent
    reason: "its headless agent reports no per-call token usage to price from, so cost per pass could not be measured on the same basis; protocol written, not run"
