# Pilot, part 1: every contestant on KB-03, the smallest task. Run into the grid's --out: its attempts are the grid's attempt 1, so the
# grid resumes from them, and `keysbench project` reads their cost.
label: keysbench-2026.10-pilot-a
cap_usd: 60.0
k: 1
effort: high
models:
- claude-haiku-5-5
- claude-sonnet-5-5
- claude-opus-5-5
- claude-fable-5-1
- openai/gpt-5.6-sol
- google/gemini-3.1-pro-preview
- qwen/qwen3-coder-next
configs:
- B
- A0
- A
configs_by_model:
  openai/gpt-5.6-sol:
  - B
  google/gemini-3.1-pro-preview:
  - B
  qwen/qwen3-coder-next:
  - B
tasks:
- KB-03
max_tokens: 32000
max_steps: 12
judge:
  default: claude-opus-5-5
  instead: claude-sonnet-5-5
cli:
  version: 2.1.296
  timeout_s: 1800
reduction: []
applied_step: 0
not_run:
- contestant: codex-cli
  reason: 'not run: OpenAI''s model is measured in configuration B (GPT-5.6 Sol); its own harness, the Codex CLI, needs an
    OpenAI account set up for this run, which was not'
- contestant: cursor-agent
  reason: 'not run: its headless agent reports no per-call token usage, so cost per pass could not be measured on the same
    basis'
